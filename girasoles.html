<title>Girasoles al Nacer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap">
<style>
  :root{
    --bg-deep:#0b0e24;
    --bg-deeper:#05061a;
    --bg-glow:#241a4a;
    --petal-gold:#ffc93c;
    --petal-amber:#ff8f1c;
    --center-dark:#2b1608;
    --center-ring:#6e3d14;
    --leaf-deep:#173d29;
    --leaf-mid:#2f7d4f;
    --leaf-light:#4fa06a;
    --ink:#f4efe3;
    --ink-dim:#c9c3e0;
    --stem:#2c6b45;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:radial-gradient(120% 90% at 50% 12%, var(--bg-glow) 0%, var(--bg-deep) 46%, var(--bg-deeper) 100%);
    color:var(--ink);
    font-family:"Sora","Segoe UI",sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:640px;
    aspect-ratio:2/3;
    margin:0 auto;
    display:flex;
    flex-direction:column;
  }

  canvas#sky{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  .garden{
    position:relative;
    z-index:2;
    width:100%;
    flex:1;
    display:block;
    padding-top:clamp(20px,5vh,44px);
  }

  .garden svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }

  /* ---- stems (attribute transform only on their own <g>, safe) ---- */
  .stem-path{
    fill:none;
    stroke:var(--stem);
    stroke-width:5;
    stroke-linecap:round;
    stroke-dasharray:100;
    stroke-dashoffset:100;
    animation:draw 0.85s cubic-bezier(.34,.9,.4,1) forwards;
    animation-delay:var(--d, 0s);
  }
  @keyframes draw{
    to{stroke-dashoffset:0;}
  }

  /* ---- leaves along stem: class sits on an INNER g with no attribute
         transform of its own, so it never collides with the outer
         positioning g's transform="translate(...) rotate(...)" ---- */
  .stem-leaf{
    transform-origin:0px 0px;
    transform:scale(0);
    opacity:0;
    animation:leafPop .55s cubic-bezier(.3,1.6,.5,1) forwards;
    animation-delay:calc(var(--d, 0s) + 0.5s);
  }
  @keyframes leafPop{
    to{transform:scale(1); opacity:1;}
  }

  /* ---- flower head: two inner layers, each with its OWN class, so the
         "bloom" entrance and the "sway" idle loop never fight over the
         same `animation` shorthand on one element. Both live inside a
         plain positioning <g> (attribute transform only). ---- */
  .flower-bloom{
    transform-origin:100px 100px;
    transform:scale(0) rotate(-14deg);
    opacity:0;
    filter:drop-shadow(0 0 14px rgba(255,180,60,.55));
    animation:bloom .7s cubic-bezier(.28,1.4,.4,1) forwards;
    animation-delay:calc(var(--d, 0s) + 0.62s);
  }
  @keyframes bloom{
    60%{transform:scale(1.08) rotate(3deg); opacity:1;}
    to{transform:scale(1) rotate(0deg); opacity:1;}
  }

  .flower-sway{
    transform-origin:100px 100px;
    animation:sway var(--sdur,5s) ease-in-out infinite alternate;
    animation-delay:calc(var(--d, 0s) + 1.35s + var(--sdelay,0s));
  }
  @keyframes sway{
    from{transform:rotate(-1.6deg);}
    to{transform:rotate(1.6deg);}
  }

  .petal{
    transform-origin:100px 100px;
    transform:scale(0);
    animation:petalUnfurl .5s ease-out forwards;
    animation-delay:calc(var(--d, 0s) + 0.62s + var(--pd,0s));
  }
  @keyframes petalUnfurl{
    to{transform:scale(1);}
  }

  .bush{
    transform-origin:200px 600px;
    transform:scale(0);
    opacity:0;
    animation:bushPop 1s cubic-bezier(.3,1.4,.4,1) forwards;
    animation-delay:0.05s;
  }
  @keyframes bushPop{
    to{transform:scale(1); opacity:1;}
  }

  .controls{
    position:relative;
    z-index:3;
    display:flex;
    justify-content:center;
    padding:8px 0 clamp(20px,4vh,32px);
  }

  button#replay{
    font-family:"Sora",sans-serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:.03em;
    color:var(--ink);
    background:rgba(255,201,60,.1);
    border:1px solid rgba(255,201,60,.35);
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease, transform .15s ease;
  }
  button#replay:hover{
    background:rgba(255,201,60,.2);
    border-color:rgba(255,201,60,.55);
  }
  button#replay:active{ transform:scale(.96); }
  button#replay:focus-visible{
    outline:2px solid var(--petal-gold);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    .stem-path, .stem-leaf, .flower-bloom, .petal, .bush{
      animation-duration:.01s !important;
      animation-delay:0s !important;
    }
    .flower-sway{ animation:none; }
  }
</style>

<script>
(function(){
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var stage = document.querySelector('.stage');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W, H;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    var rect = stage.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // twinkling stars
  var stars = [];
  var starCount = Math.round((W*H)/9000) + 24;
  for (var i=0;i<starCount;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H*0.55,
      r: Math.random()*1.6 + 0.5,
      phase: Math.random()*Math.PI*2,
      speed: 0.6 + Math.random()*1.1,
      four: Math.random() < 0.16
    });
  }

  // floating fireflies / light bokeh
  var flies = [];
  var flyCount = 14;
  for (var j=0;j<flyCount;j++){
    flies.push(makeFly());
  }
  function makeFly(){
    return {
      x: Math.random()*W,
      y: H*0.45 + Math.random()*H*0.55,
      r: Math.random()*2.2 + 1.4,
      vy: -(0.08 + Math.random()*0.14),
      vx: (Math.random()-0.5)*0.06,
      life: 0,
      maxLife: 220 + Math.random()*260,
      phase: Math.random()*Math.PI*2
    };
  }

  function drawStar4(x,y,r,alpha){
    ctx.save();
    ctx.translate(x,y);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(0,-r*3); ctx.lineTo(r*0.5,-r*0.5);
    ctx.lineTo(r*3,0); ctx.lineTo(r*0.5,r*0.5);
    ctx.lineTo(0,r*3); ctx.lineTo(-r*0.5,r*0.5);
    ctx.lineTo(-r*3,0); ctx.lineTo(-r*0.5,-r*0.5);
    ctx.closePath();
    ctx.fillStyle = '#ffe9a8';
    ctx.fill();
    ctx.restore();
  }

  var t = 0;
  function frame(){
    t += 1;
    ctx.clearRect(0,0,W,H);

    // stars
    for (var i=0;i<stars.length;i++){
      var s = stars[i];
      var tw = 0.35 + 0.65 * (0.5 + 0.5*Math.sin(t*0.02*s.speed + s.phase));
      if (s.four){
        drawStar4(s.x, s.y, s.r*1.3, tw*0.9);
      } else {
        ctx.beginPath();
        ctx.globalAlpha = tw;
        ctx.fillStyle = '#fff6df';
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // fireflies
    for (var k=0;k<flies.length;k++){
      var f = flies[k];
      f.life++;
      f.x += f.vx + Math.sin(t*0.03 + f.phase)*0.08;
      f.y += f.vy;
      var lifeRatio = f.life / f.maxLife;
      var fade = lifeRatio < 0.15 ? lifeRatio/0.15 : (lifeRatio > 0.8 ? (1-lifeRatio)/0.2 : 1);
      var glow = ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*5);
      glow.addColorStop(0, 'rgba(255,233,168,'+(0.9*fade)+')');
      glow.addColorStop(1, 'rgba(255,233,168,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.r*5,0,Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,246,223,'+fade+')';
      ctx.arc(f.x,f.y,f.r*0.5,0,Math.PI*2);
      ctx.fill();
      if (f.life > f.maxLife || f.y < H*0.05){
        flies[k] = makeFly();
      }
    }

    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
  if (reduce){
    setInterval(frame, 2000);
  }

  // replay control: retrigger CSS animations
  var replayBtn = document.getElementById('replay');
  var animatedEls = document.querySelectorAll('.stem-path, .stem-leaf, .flower-bloom, .flower-sway, .petal, .bush');
  replayBtn.addEventListener('click', function(){
    animatedEls.forEach(function(el){
      el.style.animation = 'none';
    });
    void document.body.offsetHeight;
    animatedEls.forEach(function(el){
      el.style.animation = '';
    });
  });
})();
</script>
